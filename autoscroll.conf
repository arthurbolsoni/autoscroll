# autoscroll - depois de editar: sudo systemctl restart autoscroll
# Curva do Chromium/Edge: velocidade (px/s) = SPEED_MULT * (px arrastados) ^ SPEED_EXP, por eixo.

DEADZONE_PX = 15          # zona parada em volta do clique
SPEED_MULT = 0.008        # velocidade geral
SPEED_EXP = 2.2           # formato da curva
MAX_PX_PER_SEC = 30000
PX_PER_NOTCH = 55         # px que um dente da roda rola nos apps; menor = mais rápido
MAX_DRAG_PX = 1200
TICK_HZ = 90
NATURAL = false
TOGGLE_MODE = false       # true = um clique começa, outro clique para
DESKTOP_SCROLL = false
GHOST_CURSOR = true
GHOST_SCALE = 1.0
SNAP_CURSOR_ON_RELEASE = true
ANCHOR_CURSOR = false     # true = cursor preso no clique + fantasma (midscroll)
BLACKLIST = freecad, orcaslicer, minecraft
EXTRA_DEVICES =
IGNORE_DEVICES =
